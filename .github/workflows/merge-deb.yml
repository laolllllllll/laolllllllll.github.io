name: Merge DEB chunks
on:
  push:
    paths:
      - 'repo/debs/chunk_*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge 15 chunks and cleanup
        run: |
          cat repo/debs/chunk_aa repo/debs/chunk_ab repo/debs/chunk_ac repo/debs/chunk_ad repo/debs/chunk_ae repo/debs/chunk_af repo/debs/chunk_ag repo/debs/chunk_ah repo/debs/chunk_ai repo/debs/chunk_aj repo/debs/chunk_ak repo/debs/chunk_al repo/debs/chunk_am repo/debs/chunk_an repo/debs/chunk_ao > repo/debs/com.kiloo.subwaysurfers_1.86.0-4_iphoneos-arm.deb
          rm -f repo/debs/chunk_*
          rm -f repo/debs/deb.part_*
          ls -la repo/debs/
      - name: Commit merged deb
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repo/debs/
          git commit -m "Merge 15 deb chunks, remove all parts" || echo "No changes"
          git push
